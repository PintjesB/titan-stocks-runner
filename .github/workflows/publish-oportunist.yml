name: publish-oportunist

on:
  push:
    branches: [main]
    paths:
      - 'runners/oportunist/**'
      - '.github/workflows/_publish-runner.yml'
      - '.github/workflows/publish-oportunist.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-oportunist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/_publish-runner.yml
    with:
      profile: oportunist
      image: ghcr.io/pintjesb/oportunist-runner

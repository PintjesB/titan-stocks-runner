name: upstream-check

# Weekly check that the pinned Actions Runner version tracks upstream
# ``actions/runner``. GitHub ends runner support 30 days after a new
# release; the check opens an issue when the pinned version drifts from
# upstream so the operator can schedule a tested image release.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Compare pinned version with upstream release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Run upstream-version script
        id: check
        env:
          RUNNER_VERSION: 2.336.0
        run: |
          set +e
          output="$(bash scripts/upstream-version.sh 2>&1)"
          rc=$?
          set -e
          echo "$output"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open an issue when drift is detected
        if: steps.check.outputs.drift == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c8849a56b # v7
        with:
          script: |
            const title = 'Runner version drift detected';
            const body = [
              'The pinned Actions Runner version in `Dockerfile` lags the',
              'latest upstream `actions/runner` release detected by',
              '`scripts/upstream-version.sh`. GitHub ends runner support',
              '30 days after a new release, so a fresh `titan-stocks-runner`',
              'image must be published before the cutoff.',
              '',
              'See `docs/operations.md#updating-the-runner-image` for the',
              'update procedure.',
            ].join('\n');
            const issues = await github.rest.issues.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'runner-drift',
            });
            if (issues.data.filter(i => i.title === title).length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['runner-drift'],
              });
            }

name: publish

# Publish the runner image to GHCR. ``main`` builds publish a moving
# ``edge`` tag and a commit-addressed ``sha-<short>`` tag. Immutable
# ``vX.Y.Z`` tags publish on release tags and additionally produce a
# short ``X.Y`` minor tag. Every published image receives a keyless
# signature and an SBOM attestation.
#
# Permissions follow GitHub's GHCR publishing guidance documented at
# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04-arm
    if: >-
      github.event_name == 'push' &&
      github.repository == 'PintjesB/titan-stocks-runner' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute deployment tags and OCI labels
        id: meta
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="$IMAGE"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          short_sha="${GITHUB_SHA::12}"

          publish_version="edge"
          extra_tags=()

          if [[ "$REF" == refs/tags/v* ]]; then
            publish_version="${REF_NAME#v}"
            if ! [[ "$publish_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::release tag $REF_NAME must be vX.Y.Z"
              exit 1
            fi
            extra_tags+=("$publish_version")
            if [[ "$publish_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              extra_tags+=("${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
            fi
          fi

          {
            echo "image=$image"
            echo "created=$created"
            echo "publish_version=$publish_version"
            echo "tags<<EOF"
            echo "$image:sha-$short_sha"
            echo "$image:$publish_version"
            for tag in "${extra_tags[@]}"; do
              echo "$image:$tag"
            done
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=titan-stocks-runner"
            echo "org.opencontainers.image.version=$publish_version"
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.created=$created"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image (provenance and SBOM enabled)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

      - name: Scan published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate exact-digest SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output: ${{ runner.temp }}/titan-stocks-runner-${{ github.sha }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3

      - name: Sign and attest the published digest
        env:
          COSIGN_YES: "true"
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          SPDX_PATH: ${{ runner.temp }}/titan-stocks-runner-${{ github.sha }}.spdx.json
        run: |
          set -euo pipefail
          cosign sign "$IMAGE_REF"
          cosign attest --yes --type spdxjson --predicate "$SPDX_PATH" "$IMAGE_REF"

      - name: Verify signature and attestation (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$IMAGE_REF"
          cosign verify-attestation --type spdxjson \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$IMAGE_REF" > /dev/null
          echo "cosign verification succeeded for $IMAGE_REF"

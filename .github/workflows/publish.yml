name: publish

# Build, probe, and push the public ARM64 runner image to GHCR.
#
# The workflow sequence reflects the operator contract: an image is
# not considered publishable until the capability probe passes
# inside the actual image. Network reachability to GitHub is
# *not* part of the probe; the listener's healthcheck is a separate
# concern and transient GitHub outages must not fail this build.
#
# Output:
#
#   ghcr.io/pintjesb/titan-stocks-runner:latest  + immutable digest
#
# Deployments pin the image by digest and ignore the mutable tag.
# The published digest is surfaced via ``steps.build.outputs.digest``
# so operators can copy it into the deployment notes.
#
# Permissions follow GitHub's GHCR publishing guidance documented at
# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, probe, and push linux/arm64 image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/arm64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: |
            ghcr.io/pintjesb/titan-stocks-runner:latest
            titan-runner:local

      - name: Run the capability probe against the built image
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
              --entrypoint /usr/local/bin/probe \
              --network host --ipc host \
              --security-opt no-new-privileges:true \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -e HOME=/tmp \
              ghcr.io/pintjesb/titan-stocks-runner:latest \
              --skip-network

      - name: Push the probed image to GHCR
        run: |
          set -euo pipefail
          docker push ghcr.io/pintjesb/titan-stocks-runner:latest

      - name: Report the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'published digest : %s\n' "$DIGEST"
          printf 'pinned reference : ghcr.io/pintjesb/titan-stocks-runner@%s\n' "$DIGEST"

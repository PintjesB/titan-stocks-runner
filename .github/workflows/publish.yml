name: publish

# Build, probe, and push the multi-platform Titan Stocks runner
# image to GHCR.
#
# The image is published as a single multi-platform manifest
# containing both ``linux/amd64`` and ``linux/arm64``. Each
# architecture is built and probed on a *native* GitHub-hosted
# runner (``ubuntu-24.04`` for AMD64, ``ubuntu-24.04-arm`` for
# ARM64); the per-architecture build MUST emit a plain image
# manifest (no embedded BuildKit provenance / SBOM) so the
# downstream merge is a flat OCI index rather than a nested index
# chain. The two exact candidate digests are validated, merged
# into a commit-specific multi-platform manifest, and probed on
# both native architectures. After both probes pass, a separate
# registry-attached provenance attestation is attached to the
# immutable merged digest. Only after attestation succeeds is the
# merged digest promoted to ``:latest``; the ``:latest`` digest is
# re-resolved and MUST equal the merged digest.
#
# Earlier versions of this workflow embedded BuildKit provenance
# directly, which produced a nested OCI index at merge time and
# caused Buildx to return exit 255 after the registry accepted the
# manifest. Embedded provenance is therefore replaced by a
# registry-attached attestation on the verified final digest.
#
# The candidate commit-specific tags are kept for diagnostics
# only; no later stage trusts them as merge inputs. Every later
# stage consumes the immutable ``repository@sha256:<digest>``
# reference resolved by an earlier stage and exported through a
# job output. The merge, verification, attestation, and promotion
# steps all use immutable references rather than mutable tags so
# a re-pushed candidate cannot leak into a downstream stage.
#
# The workflow sequence reflects the operator contract: an image
# is not considered publishable until the static contract suite,
# both native capability probes, the postcondition validation of
# the remote merged index, the registry-attached attestation,
# and the ``:latest`` digest equality check all pass.
#
# Output:
#
#   ghcr.io/pintjesb/titan-stocks-runner:latest  -> immutable digest
#                                                (manifest list with
#                                                 linux/amd64 +
#                                                 linux/arm64 +
#                                                 registry-attached
#                                                 provenance
#                                                 attestation)
#
# Deployments pin the image by digest and ignore the mutable tag.
# The published digest is surfaced via the promote step's output
# so operators can copy it into the deployment notes.
#
# Permissions follow GitHub's GHCR publishing guidance documented at
# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images
# The ``attest`` job additionally requires ``id-token`` and
# ``attestations`` write permissions for the registry-attached
# Sigstore provenance; the promote job requires
# ``artifact-metadata`` write for ``:latest`` tag management.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Static contract suite
    # The contract suite runs on a hosted runner; it does not
    # require Docker because every assertion inspects project
    # files rather than exercising the image. A failing
    # contract blocks every later step in the workflow.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install ShellCheck and pinned test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet --requirement tests/requirements.txt
      - name: Bash syntax check on every shell script
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find . -path ./.git -prune -o -path ./tests/__pycache__ -prune -o -type f -name '*.sh' -print)
          echo "all shell scripts passed bash -n"
      - name: ShellCheck on every shell script
        run: |
          set -euo pipefail
          # ``-S warning`` elevates ShellCheck ``warning``/``error``
          # diagnostics to non-zero; the contract is that the
          # scripts are warning-clean. ``info`` diagnostics remain
          # advisory so they do not silently block publishes.
          while IFS= read -r script; do
            shellcheck -S warning "$script"
          done < <(find . -path ./.git -prune -o -path ./tests/__pycache__ -prune -o -type f -name '*.sh' -print)
          echo "all shell scripts passed ShellCheck"
      - name: Shell-level contract tests
        run: |
          set -euo pipefail
          bash tests/test_runner_scripts.sh
      - name: Python contract tests
        run: |
          set -euo pipefail
          python3 -m pytest tests/test_runner_contract.py -v
      - name: Validate the Compose startup contract
        run: |
          set -euo pipefail
          # The Compose file is the one-command startup contract;
          # a regression that moves registration into a disposable service
          # or drops the fixed named workspace-volume contract
          # MUST block the publish.
          # The contract suite already pins the structural
          # assertions in Python; this step additionally confirms
          # the file is well-formed by piping it through the
          # ``docker compose config`` validator using the
          # secret-free ``.env.example`` so the contract surface
          # is checked against the same interpolation a
          # production host would perform.
          python3 tests/check_compose_contract.py
          echo "compose contract validated"

  build:
    name: Build and probe ${{ matrix.platform }}
    # Each architecture is built and probed on a *native* GitHub-
    # hosted runner so the probe exercises a host Docker daemon
    # that matches the runner image's platform. Emulated daemons
    # are explicitly rejected by the probe contract, so
    # cross-architecture builds would fail their own capability
    # gate before they reach the registry.
    runs-on: ${{ matrix.runner }}
    needs:
      - contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            tag_suffix: amd64
            expected_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: arm64
            expected_arch: arm64
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.platform }} image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # Disable embedded BuildKit provenance and SBOM so the
          # pushed image is a plain image manifest rather than an
          # OCI index wrapping the image and its attestation.
          # Provenance is attached as a registry-side attestation
          # after the merged digest is verified by both native
          # probes (see the ``attest`` job).
          provenance: false
          sbom: false
          tags: |
            ghcr.io/pintjesb/titan-stocks-runner:candidate-${{ github.sha }}-${{ matrix.tag_suffix }}
      - name: Resolve and report the candidate manifest digest
        id: digest
        env:
          IMAGE: ghcr.io/pintjesb/titan-stocks-runner:candidate-${{ github.sha }}-${{ matrix.tag_suffix }}
        run: |
          set -euo pipefail
          # Resolve the registry-served manifest digest AFTER
          # push so the value we report is definitively what GHCR
          # serves. The ``Digest:`` line emitted by ``buildx
          # imagetools inspect`` is the manifest digest; a
          # correctly-formatted digest is ``sha256:`` followed by
          # 64 lowercase hex characters.
          digest="$(docker buildx imagetools inspect "$IMAGE" \
              | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected digest format: $digest"
              exit 1
          fi
          printf 'candidate digest : %s\n' "$digest"
          # Stage the digest on disk so the next step can upload
          # it as a workflow artifact. The file is the
          # authoritative source of the candidate digest for
          # every downstream stage; mutable tags are
          # diagnostic-only after this step.
          mkdir -p "$RUNNER_TEMP"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/candidate-digest.txt"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Upload candidate digest artifact
        # The candidate digest is exported through a temporary
        # artifact so the merge job can consume the *exact*
        # registry-served digest without re-resolving the mutable
        # candidate tag. Mutable tags are diagnostic-only after
        # this step.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-digest-${{ matrix.tag_suffix }}
          path: ${{ runner.temp }}/candidate-digest.txt
          if-no-files-found: error
      - name: Run the capability probe against the pushed image
        env:
          # Use the immutable digest reference so the probe
          # cannot be redirected by a re-pushed candidate tag.
          IMAGE: ghcr.io/pintjesb/titan-stocks-runner@${{ steps.digest.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          # The probe sidecar must mirror the listener's bridge
          # contract: no ``--network host`` and no ``--ipc host``.
          # ``host.docker.internal`` is wired through the
          # host-gateway alias so the probe can resolve it
          # inside the container; ``--shm-size 2gb`` mirrors the
          # listener's isolated shared-memory allocation so
          # Chromium can launch without the host IPC namespace.
          # ``EXPECTED_ARCH`` is the native host architecture so
          # the probe refuses an emulated or mismatched Docker
          # daemon before the rest of the contract runs.
          docker run --rm --platform "${{ matrix.platform }}" \
              --entrypoint /usr/local/bin/probe \
              --security-opt no-new-privileges:true \
              --add-host host.docker.internal:host-gateway \
              --shm-size 2gb \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -e HOME=/tmp \
              -e EXPECTED_ARCH="$EXPECTED_ARCH" \
              "$IMAGE" \
              --skip-network

  merge:
    name: Merge native manifests and verify
    # Merge the two native candidate digests into a single
    # commit-specific multi-platform manifest. The merge step
    # consumes the candidate digests as immutable
    # ``repository@sha256:...`` references through the upload /
    # download-artifact round trip rather than re-resolving the
    # candidate tags. The remote merged index is then inspected
    # and validated to contain *exactly* the two expected
    # platform digests so a non-zero exit from ``imagetools
    # create`` does not silently leak a partial or nested index.
    runs-on: ubuntu-24.04
    needs:
      - build
    permissions:
      contents: read
      packages: write
    outputs:
      merged_digest: ${{ steps.merge.outputs.merged_digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download candidate digest (amd64)
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: candidate-digest-amd64
          path: ${{ runner.temp }}/inputs/amd64
      - name: Download candidate digest (arm64)
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: candidate-digest-arm64
          path: ${{ runner.temp }}/inputs/arm64
      - name: Validate candidate digests before merging
        id: validate
        env:
          AMD64_DIGEST_FILE: ${{ runner.temp }}/inputs/amd64/candidate-digest.txt
          ARM64_DIGEST_FILE: ${{ runner.temp }}/inputs/arm64/candidate-digest.txt
          REGISTRY: ghcr.io
          REPO: pintjesb/titan-stocks-runner
        run: |
          set -euo pipefail
          # Each downloaded file MUST be present and MUST contain
          # exactly one ``sha256:`` digest. The validation MUST
          # reject missing files, duplicate digests, malformed
          # digests, and *nested* indexes so the downstream merge
          # is a flat OCI index chain rather than the embedded-
          # provenance chain that caused Buildx exit 255.
          validate_digest() {
              local file="$1" arch="$2"
              if [ ! -s "$file" ]; then
                  echo "::error::$arch digest file is missing or empty: $file"
                  exit 1
              fi
              local digest
              digest="$(tr -d '[:space:]' < "$file")"
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "::error::$arch digest is malformed: $digest"
                  exit 1
              fi
              printf '%s' "$digest"
          }
          digest_amd64="$(validate_digest "$AMD64_DIGEST_FILE" amd64)"
          digest_arm64="$(validate_digest "$ARM64_DIGEST_FILE" arm64)"
          if [ "$digest_amd64" = "$digest_arm64" ]; then
              echo "::error::candidate digests are duplicates (both=$digest_amd64)"
              exit 1
          fi
          # Each candidate MUST resolve to a plain image manifest
          # (``mediaType: application/vnd.docker.distribution.manifest.v2+json``
          # or ``application/vnd.oci.image.manifest.v1+json``). A
          # nested index would mean BuildKit embedded provenance
          # was NOT disabled and the merge would chain indexes.
          check_plain_manifest() {
              local digest="$1" arch="$2"
              local mt="" inspect_output="" inspect_rc=1 attempt
              # Docker is already authenticated to GHCR in this job.
              # Inspect through Buildx so private-registry credentials
              # are reused; a raw unauthenticated curl receives 401
              # and incorrectly reports a valid candidate as invalid.
              # GHCR can take a short time to make a just-pushed digest
              # visible from a different hosted-runner region, so retry
              # the authenticated lookup before failing the merge gate.
              for attempt in 1 2 3 4 5 6; do
                  set +e
                  inspect_output="$(docker buildx imagetools inspect \
                      "${REGISTRY}/${REPO}@${digest}" 2>&1)"
                  inspect_rc=$?
                  set -e
                  mt="$(printf '%s\n' "$inspect_output" \
                      | awk '$1 == "MediaType:" {print $2; exit}')"
                  if [ "$inspect_rc" -eq 0 ] && [ -n "$mt" ]; then
                      break
                  fi
                  echo "::warning::${arch} manifest lookup attempt ${attempt} failed (rc=${inspect_rc}, media_type=${mt:-empty}); retrying"
                  sleep 10
              done
              if [ "$inspect_rc" -ne 0 ] || [ -z "$mt" ]; then
                  echo "::error::${arch} candidate manifest lookup failed after retries"
                  printf '%s\n' "$inspect_output"
                  exit 1
              fi
              case "$mt" in
                  application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json)
                      echo "  $arch candidate manifest media type: $mt"
                      ;;
                  application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json)
                      echo "::error::$arch candidate is a nested index (media type: $mt); rebuild with provenance: false and sbom: false"
                      exit 1
                      ;;
                  *)
                      echo "::error::$arch candidate has unexpected media type: $mt"
                      exit 1
                      ;;
              esac
          }
          check_plain_manifest "$digest_amd64" amd64
          check_plain_manifest "$digest_arm64" arm64
          {
              printf 'amd64_digest=%s\n' "$digest_amd64"
              printf 'arm64_digest=%s\n' "$digest_arm64"
          } >> "$GITHUB_OUTPUT"
      - name: Merge native candidates into a multi-platform manifest
        id: merge
        env:
          REGISTRY_IMAGE: ghcr.io/pintjesb/titan-stocks-runner
          MERGED_TAG: candidate-${{ github.sha }}-merged
          AMD64_REF: ghcr.io/pintjesb/titan-stocks-runner@${{ steps.validate.outputs.amd64_digest }}
          ARM64_REF: ghcr.io/pintjesb/titan-stocks-runner@${{ steps.validate.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          # ``buildx imagetools create`` re-tags a list of source
          # references as a single multi-platform image and pushes
          # it to the registry. The sources are immutable
          # ``repository@sha256:...`` references so a re-pushed
          # candidate tag cannot leak into the merge. The merge
          # tag itself is commit-specific and diagnostic-only.
          #
          # Buildx has historically returned exit 255 after
          # publishing a merged index when the registry accepted
          # the manifest but BuildKit could not parse its own
          # output. We do NOT propagate that exit directly; the
          # postcondition below inspects GHCR and only continues
          # when the remote index contains exactly the two
          # expected candidate digests. If the postcondition
          # fails we exit non-zero with the original command
          # diagnostics retained.
          set +e
          docker buildx imagetools create \
              --tag "${REGISTRY_IMAGE}:${MERGED_TAG}" \
              "$AMD64_REF" \
              "$ARM64_REF" 2>/tmp/imagetools-create.stderr
          create_rc=$?
          set -e
          echo "::group::imagetools create diagnostics"
          printf 'imagetools create exit: %s\n' "$create_rc"
          if [ -s /tmp/imagetools-create.stderr ]; then
              sed 's/^/  /' /tmp/imagetools-create.stderr || true
          fi
          echo "::endgroup::"
          # The postcondition is the authoritative gate. Even
          # when ``imagetools create`` exits 0 we still inspect
          # the remote index because a non-zero exit must not
          # leak a partial merge into downstream stages.
          merged_digest="$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${MERGED_TAG}" \
              | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$merged_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::merged digest could not be resolved (raw=$merged_digest)"
              exit 1
          fi
          # Assert the merged index carries exactly the two
          # candidate digests. The Python block below reads
          # ``MERGED_DIGEST`` from the environment rather than
          # interpolating ``github.sha`` into a quoted heredoc;
          # a previous version of this step passed the literal
          # ``${GITHUB_SHA}`` token to Python and queried a
          # non-existent reference. Reading the digest from
          # ``os.environ`` is the documented fix.
          MERGED_DIGEST="$merged_digest" \
          AMD64_DIGEST="$AMD64_REF" \
          ARM64_DIGEST="$ARM64_REF" \
          REGISTRY_IMAGE="$REGISTRY_IMAGE" \
          python3 - <<'PY'
          import json, os, subprocess, sys

          merged = os.environ["MERGED_DIGEST"]
          # The environment carries immutable image references for
          # the merge command; the registry index exposes bare
          # sha256 digests, so compare the same normalized form.
          amd64 = os.environ["AMD64_DIGEST"].split("@", 1)[-1]
          arm64 = os.environ["ARM64_DIGEST"].split("@", 1)[-1]
          image = os.environ["REGISTRY_IMAGE"]

          out = subprocess.check_output(
              [
                  "docker", "buildx", "imagetools", "inspect",
                  "--format", "{{json .Manifest}}",
                  f"{image}@{merged}",
              ],
              text=True,
          )
          manifests = json.loads(out).get("manifests", [])
          digests = sorted(
              f"{m.get('digest', '').split(':')[0]}:{m.get('digest', '').split(':')[1]}"
              if m.get("digest", "").count(":") == 1
              else m.get("digest", "")
              for m in manifests
          )
          expected = sorted([amd64, arm64])
          # Reject ``unknown/unknown`` attestation entries; the
          # merged index MUST contain exactly the two candidate
          # platform digests and nothing else.
          for m in manifests:
              platform = m.get("platform", {}) or {}
              arch = platform.get("architecture")
              os_field = platform.get("os")
              if arch == "unknown" or os_field == "unknown":
                  sys.stderr.write(
                      "merged index contains an unknown/unknown attestation "
                      f"entry: platform={platform!r} digest={m.get('digest')!r}\n"
                  )
                  sys.exit(1)
          if digests != expected:
              sys.stderr.write(
                  "merged index does not contain exactly the two candidate "
                  f"digests. expected={expected} got={digests}\n"
              )
              sys.exit(1)
          print(f"merged digest    : {merged}")
          print(f"merged platforms : amd64, arm64")
          PY
          printf 'merged digest    : %s\n' "$merged_digest"
          # Stage the merged digest on disk so the next step can
          # upload it as a workflow artifact. The file is the
          # authoritative source of the merged digest for the
          # verify, attest, and promote jobs; mutable tags are
          # diagnostic-only after this step.
          mkdir -p "$RUNNER_TEMP"
          printf '%s\n' "$merged_digest" > "$RUNNER_TEMP/merged-digest.txt"
          echo "merged_digest=$merged_digest" >> "$GITHUB_OUTPUT"
      - name: Upload merged digest artifact
        # The merged digest is exported through a temporary
        # artifact so the verify, attest, and promote jobs can
        # consume the *exact* registry-served digest without
        # re-resolving the mutable merged tag.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merged-digest
          path: ${{ runner.temp }}/merged-digest.txt
          if-no-files-found: error

  verify:
    name: Probe merged manifest on ${{ matrix.platform }}
    # Probe the merged manifest on *both* native architectures.
    # Both native verification jobs and the attestation job
    # consume the immutable merged digest through the merge job
    # output rather than re-resolving a mutable tag.
    runs-on: ${{ matrix.runner }}
    needs:
      - merge
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            expected_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            expected_arch: arm64
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Download merged digest artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: merged-digest
          path: ${{ runner.temp }}
      - name: Probe merged manifest on ${{ matrix.platform }}
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          # Resolve the merged digest from the downloaded
          # artifact. The reference is the exact registry-served
          # digest the merge step validated; mutable merged tags
          # are diagnostic-only and never reach this step.
          merged_digest="$(tr -d '[:space:]' < "$RUNNER_TEMP/merged-digest.txt")"
          if [[ ! "$merged_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::merged digest artifact is malformed: $merged_digest"
              exit 1
          fi
          docker run --rm --platform "${{ matrix.platform }}" \
              --entrypoint /usr/local/bin/probe \
              --security-opt no-new-privileges:true \
              --add-host host.docker.internal:host-gateway \
              --shm-size 2gb \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -e HOME=/tmp \
              -e EXPECTED_ARCH="$EXPECTED_ARCH" \
              "ghcr.io/pintjesb/titan-stocks-runner@${merged_digest}" \
              --skip-network

  attest:
    name: Attach registry provenance to merged digest
    # After both native probes pass, attach a separate
    # registry-side Sigstore provenance attestation to the
    # immutable merged digest. The attestation action is pinned
    # by SHA-256; the ``id-token``, ``attestations``, and
    # ``artifact-metadata`` write permissions are required for
    # the keyless OIDC signing flow. Promotion is gated on this
    # step: a failed attestation MUST prevent ``:latest`` from
    # being tagged.
    runs-on: ubuntu-24.04
    needs:
      - verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Download merged digest artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: merged-digest
          path: ${{ runner.temp }}
      - name: Log in to GHCR for attestation
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve merged digest for attestation
        id: digest
        run: |
          set -euo pipefail
          merged_digest="$(tr -d '[:space:]' < "$RUNNER_TEMP/merged-digest.txt")"
          if [[ ! "$merged_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::merged digest artifact is malformed: $merged_digest"
              exit 1
          fi
          echo "digest=$merged_digest" >> "$GITHUB_OUTPUT"
      - name: Attach provenance attestation to merged digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v2
        with:
          subject-name: ghcr.io/pintjesb/titan-stocks-runner
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  promote:
    name: Promote verified digest and report
    # Promotion to ``:latest`` MUST run only after the
    # attestation step succeeds. The promote job consumes the
    # immutable merged digest and tags it as ``:latest``; the
    # ``:latest`` digest is re-resolved and MUST equal the
    # merged digest so a race against another concurrent push
    # cannot ship a different manifest under ``:latest``.
    runs-on: ubuntu-24.04
    needs:
      - attest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download merged digest artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: merged-digest
          path: ${{ runner.temp }}
      - name: Promote verified manifest to :latest
        run: |
          set -euo pipefail
          merged_digest="$(tr -d '[:space:]' < "$RUNNER_TEMP/merged-digest.txt")"
          if [[ ! "$merged_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::merged digest artifact is malformed: $merged_digest"
              exit 1
          fi
          # Promote the *exact* merged digest. We never reach for
          # the mutable merged tag; the reference is the
          # registry-served digest that passed both native probes
          # and the attestation step.
          docker buildx imagetools create \
              --tag ghcr.io/pintjesb/titan-stocks-runner:latest \
              "ghcr.io/pintjesb/titan-stocks-runner@${merged_digest}"
      - name: Resolve and verify the GHCR-served :latest digest
        run: |
          set -euo pipefail
          merged_digest="$(tr -d '[:space:]' < "$RUNNER_TEMP/merged-digest.txt")"
          if [[ ! "$merged_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::merged digest artifact is malformed: $merged_digest"
              exit 1
          fi
          # Re-resolve ``:latest`` from the registry and require
          # the digest to equal the merged digest. A divergence
          # means a concurrent push raced and tagged ``:latest``
          # with a different manifest; the workflow MUST fail
          # rather than ship a misleading pointer.
          digest="$(docker buildx imagetools inspect ghcr.io/pintjesb/titan-stocks-runner:latest \
              | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected :latest digest format: $digest"
              exit 1
          fi
          if [ "$digest" != "$merged_digest" ]; then
              echo "::error:::latest digest ($digest) does not equal merged digest ($merged_digest); refusing to report"
              exit 1
          fi
          printf 'published digest : %s\n' "$digest"
          printf 'pinned reference : ghcr.io/pintjesb/titan-stocks-runner@%s\n' "$digest"

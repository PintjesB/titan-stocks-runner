name: publish

# Build and push the public ARM64 runner image to GHCR.
#
# This workflow is the single CI surface for the runner repository.
# A successful ``linux/arm64`` build on hosted ``ubuntu-24.04-arm`` is
# the validation step; no scan, SBOM, signature, attestation, or test
# lane is run.
#
# Output: ``ghcr.io/pintjesb/titan-stocks-runner:latest`` plus the
# immutable digest surfaced via the ``build`` step's ``outputs.digest``.
# Deployments pin the digest (e.g. ``...@sha256:<digest>``) and pin
# the published tag (``latest``) only as a fallback.
#
# Permissions follow GitHub's GHCR publishing guidance documented at
# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push linux/arm64 image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/arm64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/pintjesb/titan-stocks-runner:latest
      - name: Report the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'published digest: %s\n' "$DIGEST"
          printf 'pinned reference : ghcr.io/pintjesb/titan-stocks-runner@%s\n' "$DIGEST"

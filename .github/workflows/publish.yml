name: publish

# Build, probe, and push the multi-platform Titan Stocks runner
# image to GHCR.
#
# The image is published as a single multi-platform manifest
# containing both ``linux/amd64`` and ``linux/arm64``. Each
# architecture is built and probed on a *native* GitHub-hosted
# runner (``ubuntu-24.04`` for AMD64, ``ubuntu-24.04-arm`` for
# ARM64) and pushed under a commit-specific tag. The two exact
# candidate digests are merged into a commit-specific
# multi-platform manifest; the merged manifest is then pulled
# and probed on both native architectures; only after both
# probes pass is the merged digest promoted to ``:latest`` and
# reported as the immutable manifest digest. Operators pin by
# digest and ignore the mutable ``:latest`` tag.
#
# The workflow sequence reflects the operator contract: an image
# is not considered publishable until the static contract suite,
# both native capability probes, and the registry-served digest
# check all pass. Network reachability to GitHub is *not* part of
# the probe; the listener's healthcheck is a separate concern and
# transient GitHub outages must not fail this build.
#
# Output:
#
#   ghcr.io/pintjesb/titan-stocks-runner:latest  + immutable digest
#                                               (manifest list with
#                                                linux/amd64 +
#                                                linux/arm64)
#
# Deployments pin the image by digest and ignore the mutable tag.
# The published digest is surfaced via the digest step's output so
# operators can copy it into the deployment notes.
#
# Permissions follow GitHub's GHCR publishing guidance documented at
# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Static contract suite
    # The contract suite runs on a hosted runner; it does not
    # require Docker because every assertion inspects project
    # files rather than exercising the image. A failing
    # contract blocks every later step in the workflow.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install ShellCheck and pinned test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet --requirement tests/requirements.txt
      - name: Bash syntax check on every shell script
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find . -path ./.git -prune -o -path ./tests/__pycache__ -prune -o -type f -name '*.sh' -print)
          echo "all shell scripts passed bash -n"
      - name: ShellCheck on every shell script
        run: |
          set -euo pipefail
          # ``-S warning`` elevates ShellCheck ``warning``/``error``
          # diagnostics to non-zero; the contract is that the
          # scripts are warning-clean. ``info`` diagnostics remain
          # advisory so they do not silently block publishes.
          while IFS= read -r script; do
            shellcheck -S warning "$script"
          done < <(find . -path ./.git -prune -o -path ./tests/__pycache__ -prune -o -type f -name '*.sh' -print)
          echo "all shell scripts passed ShellCheck"
      - name: Shell-level contract tests
        run: |
          set -euo pipefail
          bash tests/test_runner_scripts.sh
      - name: Python contract tests
        run: |
          set -euo pipefail
          python3 -m pytest tests/test_runner_contract.py -v
      - name: Validate the Compose startup contract
        run: |
          set -euo pipefail
          # The Compose file is the one-command startup contract;
          # a regression that drops the registration sidecar, the
          # ``depends_on: service_completed_successfully`` gate,
          # the dependency restart behaviour, or the identical
          # host/container work bind mount MUST block the publish.
          # The contract suite already pins the structural
          # assertions in Python; this step additionally confirms
          # the file is well-formed by piping it through the
          # ``docker compose config`` validator using the
          # secret-free ``.env.example`` so the contract surface
          # is checked against the same interpolation a
          # production host would perform.
          python3 tests/check_compose_contract.py
          echo "compose contract validated"

  build:
    name: Build and probe ${{ matrix.platform }}
    # Each architecture is built and probed on a *native* GitHub-
    # hosted runner so the probe exercises a host Docker daemon
    # that matches the runner image's platform. Emulated daemons
    # are explicitly rejected by the probe contract, so
    # cross-architecture builds would fail their own capability
    # gate before they reach the registry.
    runs-on: ${{ matrix.runner }}
    needs:
      - contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            tag_suffix: amd64
            expected_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: arm64
            expected_arch: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.platform }} image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/pintjesb/titan-stocks-runner:candidate-${{ github.sha }}-${{ matrix.tag_suffix }}
      - name: Resolve and report the candidate manifest digest
        id: digest
        env:
          IMAGE: ghcr.io/pintjesb/titan-stocks-runner:candidate-${{ github.sha }}-${{ matrix.tag_suffix }}
        run: |
          set -euo pipefail
          # Resolve the registry-served manifest digest AFTER
          # push so the value we report is definitively what GHCR
          # serves. The ``Digest:`` line emitted by ``buildx
          # imagetools inspect`` is the manifest digest; a
          # correctly-formatted digest is ``sha256:`` followed by
          # 64 lowercase hex characters.
          digest="$(docker buildx imagetools inspect "$IMAGE" \
              | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected digest format: $digest"
              exit 1
          fi
          printf 'candidate digest : %s\n' "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Run the capability probe against the pushed image
        env:
          IMAGE: ghcr.io/pintjesb/titan-stocks-runner:candidate-${{ github.sha }}-${{ matrix.tag_suffix }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          # The probe sidecar must mirror the listener's bridge
          # contract: no ``--network host`` and no ``--ipc host``.
          # ``host.docker.internal`` is wired through the
          # host-gateway alias so the probe can resolve it
          # inside the container; ``--shm-size 2gb`` mirrors the
          # listener's isolated shared-memory allocation so
          # Chromium can launch without the host IPC namespace.
          # ``EXPECTED_ARCH`` is the native host architecture so
          # the probe refuses an emulated or mismatched Docker
          # daemon before the rest of the contract runs.
          docker run --rm --platform "${{ matrix.platform }}" \
              --entrypoint /usr/local/bin/probe \
              --security-opt no-new-privileges:true \
              --add-host host.docker.internal:host-gateway \
              --shm-size 2gb \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -e HOME=/tmp \
              -e EXPECTED_ARCH="$EXPECTED_ARCH" \
              "$IMAGE" \
              --skip-network

  merge:
    name: Merge native manifests and verify
    # Merge the two native candidate digests into a single
    # commit-specific multi-platform manifest. ``buildx imagetools
    # create`` does not accept pinned digest sources directly; the
    # merge step reuses the commit-specific tags resolved by the
    # matrix builds and reports the resulting multi-platform
    # manifest digest. Both probes then run on the merged image
    # before the workflow promotes the verified digest to
    # ``:latest``.
    runs-on: ubuntu-24.04
    needs:
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge native candidates into a multi-platform manifest
        id: merge
        env:
          BASE_IMAGE: ghcr.io/pintjesb/titan-stocks-runner:candidate-${{ github.sha }}
        run: |
          set -euo pipefail
          # ``buildx imagetools create`` re-tags a list of source
          # references as a single multi-platform image and pushes
          # it to the registry. The two native candidates are
          # built and pushed by the matrix builds above; the
          # merge step MUST run only after both native probes
          # pass. The merged manifest is tagged with a
          # commit-specific alias so the next steps can resolve
          # it back into a digest.
          docker buildx imagetools create \
              --tag "${BASE_IMAGE}-merged" \
              "${BASE_IMAGE}-amd64" \
              "${BASE_IMAGE}-arm64"
          merged_digest="$(docker buildx imagetools inspect "${BASE_IMAGE}-merged" \
              | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$merged_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected merged digest format: $merged_digest"
              exit 1
          fi
          printf 'merged digest    : %s\n' "$merged_digest"
          echo "merged_digest=$merged_digest" >> "$GITHUB_OUTPUT"
      - name: Assert merged index contains both architectures
        env:
          IMAGE: ghcr.io/pintjesb/titan-stocks-runner:candidate-${{ github.sha }}-merged
        run: |
          set -euo pipefail
          # The merged image MUST carry both ``linux/amd64`` and
          # ``linux/arm64`` entries. Provenance / attestation
          # entries may additionally appear; the assertion is
          # platform-name driven, not platform-count driven.
          python3 - <<'PY'
          import json, subprocess, sys
          out = subprocess.check_output(
              ["docker", "buildx", "imagetools", "inspect", "--raw",
               "ghcr.io/pintjesb/titan-stocks-runner:candidate-${GITHUB_SHA}-merged"],
              text=True,
          )
          manifests = json.loads(out).get("manifests", [])
          platforms = {m.get("platform", {}).get("architecture") for m in manifests}
          missing = {"amd64", "arm64"} - platforms
          if missing:
              sys.stderr.write(
                  "merged manifest is missing required architectures: "
                  f"{sorted(missing)}; got {sorted(platforms)}\n"
              )
              sys.exit(1)
          print(f"merged platforms: {sorted(platforms)}")
          PY

  verify:
    name: Probe merged manifest on ${{ matrix.platform }}
    # Probe the merged manifest on *both* native architectures.
    # Promotion to ``:latest`` MUST be gated on both probes
    # passing; a regression in either platform cannot ship
    # through a partial green.
    runs-on: ${{ matrix.runner }}
    needs:
      - merge
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            expected_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            expected_arch: arm64
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Probe merged manifest on ${{ matrix.platform }}
        env:
          IMAGE: ghcr.io/pintjesb/titan-stocks-runner:candidate-${{ github.sha }}-merged
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          docker run --rm --platform "${{ matrix.platform }}" \
              --entrypoint /usr/local/bin/probe \
              --security-opt no-new-privileges:true \
              --add-host host.docker.internal:host-gateway \
              --shm-size 2gb \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -e HOME=/tmp \
              -e EXPECTED_ARCH="$EXPECTED_ARCH" \
              "$IMAGE" \
              --skip-network

  promote:
    name: Promote verified digest and report
    runs-on: ubuntu-24.04
    needs:
      - verify
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified manifest to :latest
        env:
          IMAGE: ghcr.io/pintjesb/titan-stocks-runner:candidate-${{ github.sha }}-merged
        run: |
          set -euo pipefail
          docker buildx imagetools create \
              --tag ghcr.io/pintjesb/titan-stocks-runner:latest \
              "$IMAGE"
      - name: Resolve and report the GHCR-served digest
        env:
          IMAGE: ghcr.io/pintjesb/titan-stocks-runner:latest
        run: |
          set -euo pipefail
          # Resolve the registry-served manifest digest AFTER
          # promotion so the value we report is definitively
          # what GHCR serves. The ``Digest:`` line emitted by
          # ``buildx imagetools inspect`` is the manifest digest;
          # a correctly-formatted digest is ``sha256:`` followed
          # by 64 lowercase hex characters.
          digest="$(docker buildx imagetools inspect "$IMAGE" \
              | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected digest format: $digest"
              exit 1
          fi
          printf 'published digest : %s\n' "$digest"
          printf 'pinned reference : ghcr.io/pintjesb/titan-stocks-runner@%s\n' "$digest"

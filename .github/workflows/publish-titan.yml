name: publish-titan

on:
  push:
    branches: [main]
    paths:
      - 'runners/titan/**'
      - '.github/workflows/_publish-runner.yml'
      - '.github/workflows/publish-titan.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-titan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/_publish-runner.yml
    with:
      profile: titan
      image: ghcr.io/pintjesb/titan-stocks-runner

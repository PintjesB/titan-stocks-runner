name: publish-titan

on:
  push:
    branches: [main]
    paths:
      - 'runners/titan/**'
      - '.github/workflows/publish-titan.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-titan-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pintjesb/titan-stocks-runner

jobs:
  contract:
    name: Titan contract suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: runners/titan
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install contract dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet --requirement tests/requirements.txt
      - name: Bash syntax check
        run: |
          set -euo pipefail
          while IFS= read -r script; do bash -n "$script"; done < <(find . -type f -name '*.sh' -print)
      - name: ShellCheck
        run: |
          set -euo pipefail
          while IFS= read -r script; do shellcheck -S warning "$script"; done < <(find . -type f -name '*.sh' -print)
      - name: Python contract tests
        run: python3 -m pytest tests -v
      - name: Compose contract
        run: python3 tests/check_compose_contract.py

  build:
    name: Build and probe Titan ${{ matrix.platform }}
    needs: contract
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
            expected_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
            expected_arch: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./runners/titan
          file: ./runners/titan/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}-${{ matrix.suffix }}
      - name: Resolve candidate digest
        id: digest
        run: |
          set -euo pipefail
          ref="${IMAGE}:candidate-${GITHUB_SHA}-${{ matrix.suffix }}"
          digest="$(docker buildx imagetools inspect "$ref" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid candidate digest: $digest"; exit 1; }
          printf '%s\n' "$digest" > "$RUNNER_TEMP/candidate-digest.txt"
      - name: Probe native candidate
        run: |
          set -euo pipefail
          digest="$(cat "$RUNNER_TEMP/candidate-digest.txt")"
          docker run --rm --platform "${{ matrix.platform }}" \
            --entrypoint /usr/local/bin/probe \
            --security-opt no-new-privileges:true \
            --add-host host.docker.internal:host-gateway \
            --shm-size 2gb \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e HOME=/tmp \
            -e EXPECTED_ARCH='${{ matrix.expected_arch }}' \
            "${IMAGE}@${digest}" --skip-network
      - name: Upload candidate digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titan-candidate-${{ matrix.suffix }}
          path: ${{ runner.temp }}/candidate-digest.txt
          if-no-files-found: error

  merge:
    name: Merge Titan native manifests
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download amd64 digest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: titan-candidate-amd64
          path: ${{ runner.temp }}/amd64
      - name: Download arm64 digest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: titan-candidate-arm64
          path: ${{ runner.temp }}/arm64
      - name: Merge exact candidate digests
        run: |
          set -euo pipefail
          amd64="$(tr -d '[:space:]' < "$RUNNER_TEMP/amd64/candidate-digest.txt")"
          arm64="$(tr -d '[:space:]' < "$RUNNER_TEMP/arm64/candidate-digest.txt")"
          for digest in "$amd64" "$arm64"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid digest: $digest"; exit 1; }
          done
          [ "$amd64" != "$arm64" ] || { echo '::error::candidate digests are identical'; exit 1; }
          docker buildx imagetools create \
            --tag "${IMAGE}:candidate-${GITHUB_SHA}-merged" \
            "${IMAGE}@${amd64}" "${IMAGE}@${arm64}"
          merged="$(docker buildx imagetools inspect "${IMAGE}:candidate-${GITHUB_SHA}-merged" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$merged" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid merged digest: $merged"; exit 1; }
          printf '%s\n' "$merged" > "$RUNNER_TEMP/merged-digest.txt"
      - name: Upload merged digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titan-merged-digest
          path: ${{ runner.temp }}/merged-digest.txt
          if-no-files-found: error

  verify:
    name: Verify Titan merged ${{ matrix.platform }}
    needs: merge
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            expected_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            expected_arch: arm64
    permissions:
      contents: read
    steps:
      - name: Download merged digest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: titan-merged-digest
          path: ${{ runner.temp }}
      - name: Probe merged image
        run: |
          set -euo pipefail
          digest="$(tr -d '[:space:]' < "$RUNNER_TEMP/merged-digest.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          docker run --rm --platform "${{ matrix.platform }}" \
            --entrypoint /usr/local/bin/probe \
            --security-opt no-new-privileges:true \
            --add-host host.docker.internal:host-gateway \
            --shm-size 2gb \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e HOME=/tmp \
            -e EXPECTED_ARCH='${{ matrix.expected_arch }}' \
            "${IMAGE}@${digest}" --skip-network

  attest:
    name: Attest Titan merged digest
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download merged digest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: titan-merged-digest
          path: ${{ runner.temp }}
      - name: Resolve digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(tr -d '[:space:]' < "$RUNNER_TEMP/merged-digest.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attach provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  promote:
    name: Promote Titan latest
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download merged digest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: titan-merged-digest
          path: ${{ runner.temp }}
      - name: Promote exact digest
        run: |
          set -euo pipefail
          merged="$(tr -d '[:space:]' < "$RUNNER_TEMP/merged-digest.txt")"
          [[ "$merged" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${merged}"
          latest="$(docker buildx imagetools inspect "${IMAGE}:latest" | awk '$1 == "Digest:" {print $2; exit}')"
          [ "$latest" = "$merged" ] || { echo "::error::latest digest $latest differs from merged $merged"; exit 1; }
          echo "published ${IMAGE}@${latest}"

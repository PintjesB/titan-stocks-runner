name: make-public-on-first-publish

# Sets the GHCR package visibility to ``public`` the first time the
# image is published. The runner image is intentionally public so an
# operator can pull it without credentials; running the container still
# requires the operator's GitHub registration token.
#
# The ``publicize`` action fails on subsequent runs because the
# container is already public; the job's ``continue-on-error`` keeps
# the workflow green for every later publish.

on:
  workflow_run:
    workflows: [publish]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  publicize:
    name: Public visibility for GHCR package
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
    steps:
      - name: Ensure the package is public
        uses: actions/configure-package-ranges@v1
        continue-on-error: true
        with:
          packages: |
            ${{ github.repository }}/titan-stocks-runner
          visibility: public

      - name: Verify an anonymous ARM64 pull works
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Resolve the digest that the publish workflow most recently
          # tagged as ``edge``. ``docker buildx imagetools inspect``
          # performs an unauthenticated HEAD request, which acts as a
          # public-pull probe.
          docker buildx imagetools inspect \
              --raw "${REGISTRY}/${IMAGE_NAME}:edge" \
              | head -n 1
          echo "anonymous image pull reachable"
